name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: appcasa
          POSTGRES_PASSWORD: appcasa
          POSTGRES_DB: appcasa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appcasa -d appcasa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://appcasa:appcasa@localhost:5432/appcasa?schema=public
      # E2E tests replace the mail sender with an in-memory one: nothing listens here.
      SMTP_URL: smtp://localhost:1025
      MAIL_FROM: "AppCasa <no-reply@appcasa.local>"

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json#packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fresh, throwaway auth secrets for this run (ADR-0008); never stored.
      # Values written to $GITHUB_ENV are not masked by GitHub: mask each one first,
      # so they do not appear in the logs of later steps.
      - name: Generate auth secrets
        run: |
          node scripts/generate-secrets.ts > "$RUNNER_TEMP/auth-secrets.env"
          while IFS= read -r line; do
            echo "::add-mask::${line#*=}"
          done < "$RUNNER_TEMP/auth-secrets.env"
          cat "$RUNNER_TEMP/auth-secrets.env" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/auth-secrets.env"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations
        run: pnpm db:deploy

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
